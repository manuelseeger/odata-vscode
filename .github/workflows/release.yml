name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: odata-vsix
      - run: node scripts/check-vsix.mjs odata-validation.vsix
      - run: gh release create "$GITHUB_REF_NAME" odata-validation.vsix --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx --no-install vsce publish --packagePath odata-validation.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
