name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v4
        with:
          name: odata-vsix
      - run: node scripts/check-vsix.mjs odata-validation.vsix
      - run: gh release create "$GITHUB_REF_NAME" odata-validation.vsix --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: odata-vsix
      - run: node scripts/check-vsix.mjs odata-validation.vsix
      - run: npx --no-install vsce publish --packagePath odata-validation.vsix --oidc
